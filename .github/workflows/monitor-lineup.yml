name: Monitorar Line-Up Intersal
on:
  schedule:
    # Executa a cada 30 minutos fora dos horários de pico (:00 e :30) para evitar atrasos/throttling do GitHub Actions
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar atualização mesmo sem mudança no hash/cabeçalho'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: main-production-sync
  cancel-in-progress: false

jobs:
  check-and-sync:
    name: Checar e Atualizar Line-Up
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci --no-audit || npm install --no-audit

      - name: Executar Sincronizador Intersal
        id: sync
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            node scripts/sync-intersal.js --force
          else
            node scripts/sync-intersal.js
          fi

      - name: Verificar se Houve Alterações
        id: git-check
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ -n "$(git status --porcelain -- src/data/saltShipmentsData.ts scripts/last_sync.json public/programacao-navios.pdf)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Foram detectadas alterações nos dados do line-up."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Nenhuma alteração nos dados do line-up."
          fi

      - name: Compilar Projeto (Build de Produção)
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          echo "Recompilando aplicação com os novos dados do Line-Up..."
          npm run build

      - name: Fazer Commit e Push Automático
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Obter data da atualização registrada pelo sincronizador
          UPDATE_DATE=$(node -e "try { const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('./scripts/last_sync.json')).lineupLastUpdated); } catch(e) { console.log(''); }")

          git add -f src/data/saltShipmentsData.ts scripts/last_sync.json public/programacao-navios.pdf
          if [ -d "dist" ]; then git add -A -f dist; fi
          if [ -d "production" ]; then git add -A -f production; fi
          if [ -d "assets" ]; then git add -A -f assets; fi
          if [ -f "dist.tar.gz" ]; then git add -f dist.tar.gz; fi

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi

          git commit -m "Auto: Atualização Line-Up Intersal ($UPDATE_DATE) [skip ci]"

          # Detectar branch alvo dinamicamente para evitar erros em execuções de schedule
          TARGET_BRANCH="${{ github.ref_name }}"
          if [ -z "$TARGET_BRANCH" ] || [ "$TARGET_BRANCH" = "null" ]; then
            TARGET_BRANCH=$(git branch --show-current)
          fi
          if [ -z "$TARGET_BRANCH" ] || [ "$TARGET_BRANCH" = "HEAD" ]; then
            TARGET_BRANCH="main"
          fi
          echo "Publicando na branch: $TARGET_BRANCH"

          git pull --rebase origin "$TARGET_BRANCH" || true
          git push origin "HEAD:$TARGET_BRANCH"

