name: Monitorar Line-Up Intersal
on:
  schedule:
    # Executa a cada 1 hora, 24 horas por dia, todos os dias (minuto 0 de cada hora)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar atualização mesmo sem mudança no cabeçalho'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-sync:
    name: Checar e Atualizar Line-Up
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      - name: Executar Sincronizador Intersal
        id: sync
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/sync-intersal.js --force
          else
            node scripts/sync-intersal.js
          fi

      - name: Verificar se Houve Alterações
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Foram detectadas alterações nos dados do line-up."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Nenhuma alteração nos dados do line-up."
          fi

      - name: Compilar Projeto (Build de Produção)
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          echo "Recompilando aplicação com os novos dados do Line-Up..."
          npm run build

      - name: Fazer Commit e Push Automático
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Obter data da atualização registrada pelo sincronizador
          UPDATE_DATE=$(node -e "try { console.log(require('./scripts/last_sync.json').lineupLastUpdated); } catch(e) { console.log(''); }")
          
          git add -f src/data/saltShipmentsData.ts scripts/last_sync.json public/programacao-navios.pdf production dist assets dist.tar.gz
          git commit -m "Auto: Atualização Line-Up Intersal ($UPDATE_DATE)" || echo "Nenhuma alteração para commitar."
          git push

